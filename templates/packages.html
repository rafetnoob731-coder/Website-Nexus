<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packages — {{ project }} | NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/nexus.css" />
  <style>
    html,body{height:100%;overflow:hidden;background:#0B0E14}
    .pkg-container{display:flex;flex-direction:column;height:100vh;max-width:1200px;margin:0 auto;padding:16px}
    .pkg-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;flex:1;overflow:hidden}
    .pkg-main,.pkg-sidebar{display:flex;flex-direction:column;overflow:hidden}
    .pkg-main{border:1px solid #1F2937;border-radius:16px;background:#0B0E14;box-shadow:inset 0 0 100px rgba(0,212,255,0.03),0 20px 60px rgba(0,0,0,0.5)}
    .pkg-sidebar{border:1px solid #1F2937;border-radius:16px;background:#0E121A;box-shadow:inset 0 0 60px rgba(139,92,246,0.02)}
    .pkg-header{padding:16px 20px;border-bottom:1px solid #1F2937;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .pkg-header h2{margin:0;font-size:16px;color:#F9FAFB;display:flex;align-items:center;gap:10px}
    .pkg-body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
    .pkg-search{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0B0E14;border:1px solid #1F2937;border-radius:10px;transition:border-color 0.2s}
    .pkg-search:focus-within{border-color:#00D4FF;box-shadow:0 0 0 3px rgba(0,212,255,0.1)}
    .pkg-search i{color:#6B7280;font-size:14px}
    .pkg-search input{flex:1;background:transparent;border:none;color:#F9FAFB;font-size:14px;outline:none}
    .pkg-search input::placeholder{color:#4B5563}
    .pkg-tabs{display:flex;gap:4px;padding:4px;background:#0B0E14;border-radius:10px;flex-shrink:0}
    .pkg-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;border:none;background:transparent;color:#6B7280}
    .pkg-tab.active{background:#1F2937;color:#F9FAFB}
    .pkg-tab:hover:not(.active){color:#9CA3AF}
    .pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .custom-install{display:flex;gap:8px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(139,92,246,0.06));border:1px solid rgba(0,212,255,0.15);border-radius:12px;margin-bottom:8px}
    .custom-install input{flex:1;background:#0B0E14;border:1px solid #1F2937;border-radius:8px;padding:10px 14px;color:#F9FAFB;font-size:14px;outline:none;font-family:monospace}
    .custom-install input:focus{border-color:#00D4FF;box-shadow:0 0 0 3px rgba(0,212,255,0.1)}
    .custom-install input::placeholder{color:#4B5563}
    .custom-install-btn{padding:10px 20px;border-radius:8px;background:var(--gradient);border:none;color:#0B0E14;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
    .custom-install-btn:hover{box-shadow:0 4px 15px rgba(0,212,255,0.4)}
    .no-match-box{text-align:center;padding:30px 20px;color:#6B7280;border:1px dashed #1F2937;border-radius:12px}
    .no-match-box .install-term{color:#00D4FF;font-weight:600;cursor:pointer;transition:0.2s}
    .no-match-box .install-term:hover{color:#F9FAFB;text-decoration:underline}
    .pkg-more{text-align:center;padding:8px;color:#4B5563;font-size:11px;border-top:1px solid #1F2937}
    .pkg-card{background:#111827;border:1px solid #1F2937;border-radius:12px;padding:14px 16px;transition:all 0.2s}
    .pkg-card:hover{border-color:rgba(0,212,255,0.2);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
    .pkg-card-name{font-weight:600;color:#F9FAFB;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .pkg-card-version{color:#6B7280;font-size:12px;margin-bottom:8px}
    .pkg-card-desc{color:#9CA3AF;font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .pkg-card-action{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;gap:6px}
    .pkg-install-btn{padding:6px 14px;font-size:12px;font-weight:600;border-radius:8px;border:none;cursor:pointer;transition:all 0.2s;background:rgba(0,212,255,0.12);color:#00D4FF}
    .pkg-install-btn:hover{background:var(--gradient);color:#0B0E14;box-shadow:0 4px 15px rgba(0,212,255,0.3)}
    .pkg-install-btn.installed{background:rgba(74,222,128,0.12);color:#4ADE80;cursor:default}
    .pkg-install-btn.pending{background:rgba(250,204,21,0.12);color:#FACC15;cursor:default;animation:glow 1.5s infinite}
    @keyframes glow{0%,100%{box-shadow:0 0 5px rgba(250,204,21,0.2)}50%{box-shadow:0 0 15px rgba(250,204,21,0.4)}}
    .pkg-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase}
    .pkg-badge.pip{background:rgba(0,212,255,0.12);color:#00D4FF}
    .pkg-badge.npm{background:rgba(251,113,133,0.12);color:#FB7185}
    .pkg-section-title{font-size:13px;font-weight:600;color:#9CA3AF;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
    .queue-list{display:flex;flex-direction:column;gap:8px}
    .queue-item{background:#111827;border:1px solid #1F2937;border-radius:10px;padding:12px 14px}
    .queue-item-name{font-size:13px;font-weight:600;color:#F9FAFB;display:flex;align-items:center;justify-content:space-between}
    .queue-item-status{font-size:11px;color:#6B7280;margin-top:4px}
    .progress-bar{width:100%;height:6px;background:#1F2937;border-radius:4px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;border-radius:4px;background:var(--gradient);width:0%;transition:width 0.5s ease}
    .progress-fill.success{background:#4ADE80}
    .progress-fill.error{background:#FB7185}
    .progress-fill.pending{background:linear-gradient(90deg,#FACC15,#00D4FF);animation:shimmer 1.5s infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .progress-fill.pending{background-size:200% 100%}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:#6B7280;text-align:center}
    .empty-state i{font-size:36px;margin-bottom:12px;opacity:0.5}
    .header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .back-link{color:#9CA3AF;font-size:14px;display:flex;align-items:center;gap:6px;text-decoration:none;transition:color 0.2s}
    .back-link:hover{color:#00D4FF}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;border:1px solid #1F2937;border-radius:12px;padding:12px 20px;color:#F9FAFB;font-size:14px;display:flex;align-items:center;gap:10px;opacity:0;transition:all 0.4s;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.success{border-color:rgba(74,222,128,0.3)}
    .toast.error{border-color:rgba(251,113,133,0.3)}
    .toast i{font-size:18px}
    @media(max-width:768px){.pkg-container{padding:8px}.pkg-layout{grid-template-columns:1fr}.pkg-sidebar{display:none}.pkg-body{padding:12px}.pkg-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="pkg-container">
  <div class="header-bar">
    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    <span style="font-size:12px;color:#6B7280">{{ username }} / {{ project }}</span>
  </div>

  <div class="pkg-layout">
    <div class="pkg-main">
      <div class="pkg-header">
        <h2><i class="fa-solid fa-cube" style="color:#00D4FF"></i> Arsenal — {{ project }}</h2>
        <div class="pkg-tabs">
          <button class="pkg-tab active" data-manager="pip" onclick="switchManager(this)"><i class="fa-brands fa-python"></i> Pip</button>
          <button class="pkg-tab" data-manager="npm" onclick="switchManager(this)"><i class="fa-brands fa-node"></i> NPM</button>
        </div>
      </div>
      <div class="pkg-body">
        <div class="custom-install">
          <i class="fa-solid fa-terminal" style="color:#00D4FF;font-size:14px"></i>
          <input type="text" id="customPkgInput" placeholder="Type any package name (e.g. django, numpy, npm:lodash) and hit Enter..." onkeydown="if(event.key==='Enter')installCustom()" />
          <button class="custom-install-btn" onclick="installCustom()"><i class="fa-solid fa-download"></i> Install</button>
        </div>
        <div class="pkg-search">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="pkgSearch" placeholder="Search popular packages..." oninput="searchPackages()" />
        </div>
        <div class="pkg-section-title">
          <span>Available Packages</span>
          <span style="font-size:11px;color:#4B5563" id="pkgCount">0 packages</span>
        </div>
        <div class="pkg-grid" id="pkgGrid">
          <div class="empty-state" id="pkgEmpty">
            <i class="fa-solid fa-box-open"></i>
            <span>Loading packages...</span>
          </div>
        </div>
      </div>
    </div>

    <div class="pkg-sidebar">
      <div class="pkg-header">
        <h2><i class="fa-solid fa-list" style="color:#8B5CF6"></i> Queue</h2>
        <span style="font-size:12px;color:#6B7280" id="queueCount">0 items</span>
      </div>
      <div class="pkg-body" id="queueBody">
        <div class="empty-state" id="queueEmpty">
          <i class="fa-solid fa-inbox"></i>
          <span>No pending installations</span>
        </div>
        <div class="queue-list" id="queueList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const PROJECT = '{{ project }}';
  let pkgManager = 'pip';
  let pkgData = {};
  let queue = [];
  let installed = {};

  // Load available packages
  function loadPackages(manager) {
    const grid = document.getElementById('pkgGrid');
    grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><span>Loading packages...</span></div>';
    // Fetch common packages from a curated list
    const pkgLists = {
      pip: [
        {name:'flask',version:'3.1.1',desc:'Web framework, built for humans.'},
        {name:'requests',version:'2.32.3',desc:'Simple HTTP for humans.'},
        {name:'numpy',version:'2.2.4',desc:'Scientific computing core.'},
        {name:'pillow',version:'11.1.0',desc:'Python imaging library.'},
        {name:'sqlalchemy',version:'2.0.36',desc:'SQL toolkit and ORM.'},
        {name:'aiohttp',version:'3.11.13',desc:'Async HTTP client/server.'},
        {name:'django',version:'5.2.1',desc:'High-level Python web framework.'},
        {name:'fastapi',version:'0.115.12',desc:'Modern fast web framework.'},
        {name:'pandas',version:'2.2.3',desc:'Data analysis library.'},
        {name:'matplotlib',version:'3.10.1',desc:'Plotting library.'},
        {name:'scipy',version:'1.15.2',desc:'Scientific computing toolkit.'},
        {name:'beautifulsoup4',version:'4.13.3',desc:'HTML/XML scraper.'},
        {name:'selenium',version:'4.30.0',desc:'Browser automation.'},
        {name:'asyncpg',version:'0.30.0',desc:'Async Postgres driver.'},
        {name:'redis',version:'5.2.1',desc:'Redis client.'},
        {name:'celery',version:'5.4.0',desc:'Distributed task queue.'},
        {name:'docker',version:'7.1.0',desc:'Docker SDK for Python.'},
        {name:'gunicorn',version:'23.0.0',desc:'WSGI HTTP server.'},
        {name:'uvicorn',version:'0.34.0',desc:'ASGI server.'},
        {name:'pydantic',version:'2.11.1',desc:'Data validation.'},
        {name:'jinja2',version:'3.1.6',desc:'Template engine.'},
        {name:'psutil',version:'7.0.0',desc:'System monitoring.'},
        {name:'python-telegram-bot',version:'21.10',desc:'Telegram Bot framework.'},
        {name:'aiogram',version:'3.18.0',desc:'Async Telegram framework.'},
        {name:'telethon',version:'1.39.0',desc:'Telegram MTProto client.'},
        {name:'pyrogram',version:'2.0.448',desc:'Telegram MTProto framework.'},
        {name:'httpx',version:'0.28.1',desc:'Async HTTP client.'},
        {name:'websockets',version:'15.0.1',desc:'WebSocket server/client.'},
        {name:'motor',version:'3.7.0',desc:'Async MongoDB driver.'},
        {name:'scikit-learn',version:'1.6.1',desc:'Machine learning.'},
        {name:'opencv-python',version:'4.11.0',desc:'Computer vision.'},
        {name:'plotly',version:'6.0.1',desc:'Interactive plotting.'}
      ],
      npm: [
        {name:'express',version:'5.1.0',desc:'Fast unopinionated web framework.'},
        {name:'axios',version:'1.7.9',desc:'Promise-based HTTP client.'},
        {name:'lodash',version:'4.17.21',desc:'Utility library.'},
        {name:'next',version:'15.2.4',desc:'React framework for production.'},
        {name:'tailwindcss',version:'4.1.4',desc:'Utility-first CSS framework.'},
        {name:'react',version:'19.1.0',desc:'UI library.'},
        {name:'typescript',version:'5.8.3',desc:'Typed JavaScript.'},
        {name:'prisma',version:'6.5.0',desc:'Next-gen ORM.'},
        {name:'socket.io',version:'4.8.1',desc:'Real-time bidirectional communication.'},
        {name:'next-auth',version:'4.24.11',desc:'Authentication for Next.js.'},
        {name:'discord.js',version:'14.18.0',desc:'Discord bot framework.'},
        {name:'telegraf',version:'4.16.3',desc:'Telegram bot framework.'},
        {name:'node-telegram-bot-api',version:'0.66.0',desc:'Telegram Bot API client.'},
        {name:'grammy',version:'1.34.0',desc:'Telegram bot framework.'},
        {name:'ws',version:'8.18.1',desc:'WebSocket client/server.'},
        {name:'redis',version:'4.7.0',desc:'Redis client for Node.'},
        {name:'mongoose',version:'8.13.0',desc:'MongoDB ODM.'},
        {name:'pg',version:'8.13.3',desc:'Postgres client.'},
        {name:'dotenv',version:'16.4.7',desc:'Environment loader.'},
        {name:'jsonwebtoken',version:'9.0.2',desc:'JWT implementation.'},
        {name:'bcrypt',version:'5.1.1',desc:'Password hashing.'},
        {name:'cors',version:'2.8.5',desc:'CORS middleware.'},
        {name:'helmet',version:'8.0.0',desc:'Security middleware.'},
        {name:'morgan',version:'1.10.0',desc:'HTTP logger.'},
        {name:'nodemon',version:'3.1.9',desc:'Dev auto-restart.'},
        {name:'pm2',version:'5.4.3',desc:'Process manager.'},
        {name:'cheerio',version:'1.0.0',desc:'HTML parser.'},
        {name:'puppeteer',version:'24.6.0',desc:'Browser automation.'},
        {name:'sharp',version:'0.34.1',desc:'Image processing.'},
        {name:'winston',version:'3.17.0',desc:'Logging library.'},
        {name:'zod',version:'3.24.3',desc:'Schema validation.'}
      ]
    };
    pkgData[manager] = pkgLists[manager] || [];
    renderPackages(manager);
  }

  function renderPackages(manager) {
    const grid = document.getElementById('pkgGrid');
    const data = pkgData[manager] || [];
    document.getElementById('pkgCount').textContent = data.length + ' packages';
    if (!data.length) {
      grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-box-open"></i><span>No packages found</span></div>';
      return;
    }
    const search = document.getElementById('pkgSearch').value.toLowerCase();
    const filtered = data.filter(function(p) { return p.name.toLowerCase().includes(search); });
    if (!filtered.length && search.length > 1) {
      const prefix = manager === 'pip' ? '' : 'npm:';
      grid.innerHTML = '<div class="no-match-box">' +
        '<i class="fa-solid fa-search" style="font-size:28px;opacity:0.4;margin-bottom:8px;display:block"></i>' +
        '<p style="margin-bottom:8px">No curated package matches <strong>"' + search + '"</strong></p>' +
        '<span class="install-term" onclick="installCustom(\'' + prefix + search + '\')">' +
        '<i class="fa-solid fa-download"></i> Install "' + search + '" as custom package</span>' +
        '</div>';
      return;
    }
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-search"></i><span>No matching packages</span></div>';
      return;
    }
    grid.innerHTML = filtered.map(function(p) {
      const isInstalled = installed[manager + ':' + p.name];
      const isQueued = queue.some(function(q) { return q.manager === manager && q.name === p.name; });
      let btnClass = 'pkg-install-btn', btnText = '<i class="fa-solid fa-download"></i> Install', disabled = '';
      if (isInstalled) { btnClass += ' installed'; btnText = '<i class="fa-solid fa-check"></i> Installed'; disabled = 'disabled'; }
      else if (isQueued) { btnClass += ' pending'; btnText = '<i class="fa-solid fa-spinner fa-spin"></i> Queued'; disabled = 'disabled'; }
      const badge = manager === 'pip' ? '<span class="pkg-badge pip">pip</span>' : '<span class="pkg-badge npm">npm</span>';
      return '<div class="pkg-card">' +
        '<div class="pkg-card-name">' + p.name + ' ' + badge + '</div>' +
        '<div class="pkg-card-version">v' + p.version + '</div>' +
        '<div class="pkg-card-desc">' + p.desc + '</div>' +
        '<div class="pkg-card-action">' +
        '<button class="' + btnClass + '" onclick="installPkg(\'' + manager + '\',\'' + p.name + '\')" ' + disabled + '>' + btnText + '</button>' +
        '</div></div>';
    }).join('');
  }

  function searchPackages() {
    renderPackages(pkgManager);
  }

  function installCustom(pkg) {
    var input = document.getElementById('customPkgInput');
    var name = pkg || input.value.trim();
    if (!name) { showToast('Enter a package name', 'error'); return; }
    input.value = '';
    var manager = name.startsWith('npm:') ? 'npm' : 'pip';
    var pkgName = name.replace(/^npm:/, '').replace(/^pip:/, '');
    if (queue.some(function(q) { return q.manager === manager && q.name === pkgName; })) return;
    const item = {id: Date.now(), manager: manager, name: pkgName, status: 'pending', progress: 0};
    queue.push(item);
    updateQueue();
    fetch('/api/install-package', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project: PROJECT, package_name: name})
    }).then(function(r) { return r.json(); }).then(function(d) {
      item.status = d.status === 'success' ? 'success' : 'error';
      item.progress = 100;
      if (d.status === 'success') installed[manager + ':' + pkgName] = true;
      updateQueue();
      renderPackages(pkgManager);
      showToast(d.status === 'success' ? 'Installed ' + pkgName + '!' : 'Failed: ' + (d.error || 'Unknown'), d.status === 'success' ? 'success' : 'error');
    }).catch(function(e) {
      item.status = 'error';
      item.progress = 100;
      updateQueue();
      showToast('Network error: ' + e.message, 'error');
    });
    var interval = setInterval(function() {
      if (item.status !== 'pending') { clearInterval(interval); return; }
      item.progress = Math.min(item.progress + Math.random() * 15, 90);
      updateQueue();
    }, 500);
  }

  function switchManager(el) {
    document.querySelectorAll('.pkg-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    pkgManager = el.dataset.manager;
    renderPackages(pkgManager);
  }

  function installPkg(manager, name) {
    if (queue.some(function(q) { return q.manager === manager && q.name === name; })) return;
    const item = {id: Date.now(), manager: manager, name: name, status: 'pending', progress: 0};
    queue.push(item);
    updateQueue();
    renderPackages(pkgManager);
    const prefix = manager === 'pip' ? '' : 'npm:';
    fetch('/api/install-package', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project: PROJECT, package_name: prefix + name})
    }).then(function(r) { return r.json(); }).then(function(d) {
      item.status = d.status === 'success' ? 'success' : 'error';
      item.progress = 100;
      if (d.status === 'success') installed[manager + ':' + name] = true;
      updateQueue();
      renderPackages(pkgManager);
      showToast(d.status === 'success' ? 'Installed ' + name + ' successfully!' : 'Failed to install ' + name + ': ' + (d.error || 'Unknown error'), d.status === 'success' ? 'success' : 'error');
    }).catch(function(e) {
      item.status = 'error';
      item.progress = 100;
      updateQueue();
      showToast('Network error: ' + e.message, 'error');
    });
    // Progress animation
    var interval = setInterval(function() {
      if (item.status !== 'pending') { clearInterval(interval); return; }
      item.progress = Math.min(item.progress + Math.random() * 15, 90);
      updateQueue();
    }, 500);
  }

  function updateQueue() {
    const list = document.getElementById('queueList');
    const empty = document.getElementById('queueEmpty');
    const count = document.getElementById('queueCount');
    count.textContent = queue.length + ' items';
    if (!queue.length) { list.innerHTML = ''; empty.style.display = 'flex'; return; }
    empty.style.display = 'none';
    list.innerHTML = queue.map(function(q, idx) {
      const statusText = {pending:'Installing...', success:'Completed', error:'Failed'};
      const barClass = q.status === 'success' ? 'success' : q.status === 'error' ? 'error' : 'pending';
      return '<div class="queue-item" data-idx="' + idx + '">' +
        '<div class="queue-item-name"><span>' + q.name + ' <span style="font-size:10px;color:#6B7280">(' + q.manager + ')</span></span>' +
        '<span style="font-size:11px;color:' + (q.status === 'pending' ? '#FACC15' : q.status === 'success' ? '#4ADE80' : '#FB7185') + '">' + statusText[q.status] + '</span></div>' +
        '<div class="progress-bar"><div class="progress-fill ' + barClass + '" style="width:' + q.progress + '%"></div></div>' +
        '</div>';
    }).join('');
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.innerHTML = '<i class="fa-solid fa-' + (type === 'success' ? 'circle-check' : 'circle-xmark') + '" style="color:' + (type === 'success' ? '#4ADE80' : '#FB7185') + '"></i> ' + msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // Init
  loadPackages('pip');
</script>
</body>
</html>
