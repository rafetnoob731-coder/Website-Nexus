<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — VIP DARK GOD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/nexus.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: var(--bg-primary);
    }
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 80%, rgba(236,72,153,0.06) 0%, transparent 50%);
    }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.25; z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -10%; left: -10%; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent-purple); bottom: -10%; right: -10%; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: var(--accent-magenta); top: 50%; left: 50%; animation-delay: -8s; }
    #particles-canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .login-wrapper { position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 20px; }
    .login-card {
      background: rgba(17,24,39,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
      animation: float 6s ease-in-out infinite;
    }
    .brand-icon {
      width: 72px; height: 72px; margin: 0 auto 16px;
      background: var(--gradient);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: #0B0E14;
      box-shadow: 0 8px 32px rgba(0,212,255,0.25);
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 6px;
    }
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:32px">
        <div class="brand-icon"><i class="fa-solid fa-crown"></i></div>
        <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.5px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent">NEXUS PANEL</h1>
        <p style="font-size:13px;color:var(--text-secondary);margin-top:4px">Powered by <strong style="color:var(--accent)">VIP DARK GOD</strong></p>
        {% if total_users is defined and total_users > 0 %}
        <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:11px;color:var(--text-muted)">
          <span><i class="fa-solid fa-users" style="color:var(--accent)"></i> {{ total_users }} registered</span>
          <span><i class="fa-solid fa-circle" style="color:var(--success);font-size:6px;vertical-align:middle"></i> 24/7 Active</span>
        </div>
        {% endif %}
      </div>

      <form method="post" action="/login">
        <div class="form-group">
          <label>Access Level</label>
          <div class="input-wrap">
            <select name="login_type" class="input">
              <option value="user">User Access</option>
              <option value="admin">Admin Root</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="username" class="input" placeholder="Enter nickname" required />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" class="input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;margin-top:8px;font-size:15px">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Authenticate
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.05)">
        <a href="https://t.me/VIP_DARK_GOD" target="_blank" style="color:var(--accent);font-weight:600;font-size:13px">
          <i class="fa-brands fa-telegram"></i> @VIP_DARK_GOD
        </a>
        <div style="margin-top:12px;font-size:10px;color:var(--text-muted);opacity:0.5">
          VIP DARK GOD &middot; Nexus Panel PRO &mdash; All rights reserved
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = (Math.random() - 0.5) * 0.6 - 0.2;
          this.r = Math.random() * 2 + 0.5;
          this.alpha = Math.random() * 0.3 + 0.1;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < 0 || this.x > w) this.vx *= -1;
          if (this.y < 0 || this.y > h) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 212, 255, ${this.alpha})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < 80; i++) particles.push(new Particle());

      let mouseX = -999, mouseY = -999;
      canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
      canvas.addEventListener('mouseleave', () => { mouseX = -999; mouseY = -999; });

      function animate() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) { p.update(); p.draw(); }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0, 212, 255, ${0.06 * (1 - dist / 140)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
          const dx = particles[i].x - mouseX;
          const dy = particles[i].y - mouseY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 180) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(mouseX, mouseY);
            ctx.strokeStyle = `rgba(139, 92, 246, ${0.1 * (1 - dist / 180)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
