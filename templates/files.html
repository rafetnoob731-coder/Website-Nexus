<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ project }} — File Manager | VIP DARK GOD</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/nexus.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }

    /* Sidebar custom overrides */
    .sidebar-files {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
      width: 260px; min-width: 260px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding-top: 52px;
    }
    .sidebar-files .file-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
    .sidebar-files .sidebar-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* Topbar */
    .topbar-files {
      position: fixed; top: 0; left: 260px; right: 0; z-index: 90;
      height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: rgba(11,14,20,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-files .file-path {
      font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);
      background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 6px;
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Main editor area */
    .editor-container {
      margin-left: 260px; padding-top: 52px;
      display: flex; flex-direction: column; height: 100vh;
    }
    .editor-tabs {
      display: flex; align-items: center; height: 36px;
      background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border);
      padding: 0 8px; overflow-x: auto; gap: 2px; flex-shrink: 0;
    }
    .editor-body {
      flex: 1; display: flex; overflow: hidden;
    }
    .editor-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); gap: 10px;
    }
    .editor-empty i { font-size: 48px; opacity: 0.2; }
    .editor-empty p { font-size: 14px; opacity: 0.6; }

    /* Keep existing tree/tab/item styles from nexus.css but override key ones */
    .sidebar-files .tree-item { padding: 6px 14px; }
    .sidebar-files .tree-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-files .tree-children { padding-left: 16px; }
    .sidebar-files .folder-arrow { font-size: 10px; width: 14px; transition: 0.2s; }
    .sidebar-files .folder-arrow.open { transform: rotate(90deg); }

    .editor-tabs::-webkit-scrollbar { height: 2px; }
    .editor-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Gutter */
    .editor-gutter {
      width: 44px; flex-shrink: 0;
      background: rgba(255,255,255,0.01);
      border-right: 1px solid var(--border);
      padding: 10px 0; text-align: right;
      font-family: var(--font-mono); font-size: 12px;
      line-height: 1.6; color: #484f58; overflow: hidden;
      user-select: none;
    }
    .editor-gutter div { padding-right: 12px; }

    .editor-textarea-wrap {
      flex: 1; position: relative; overflow: auto;
    }
    #editorTextarea {
      width: 100%; min-height: 100%;
      padding: 10px 16px; border: none; outline: none; resize: none;
      background: transparent; color: #e2e8f0;
      font-family: var(--font-mono); font-size: 13px;
      line-height: 1.6; tab-size: 2;
      white-space: pre; overflow-wrap: normal;
    }

    @media (max-width: 768px) {
      .sidebar-files { width: 48px; min-width: 48px; }
      .sidebar-files .tree-item .name { display: none; }
      .sidebar-files .tree-children { padding-left: 0; }
      .sidebar-files .tree-item .folder-arrow { display: none; }
      .sidebar-files .sidebar-header span { display: none; }
      .topbar-files { left: 48px; }
      .topbar-files .file-path { display: none; }
      .editor-container { margin-left: 48px; }
    }
    @media (max-width: 480px) {
      .sidebar-files { width: 40px; min-width: 40px; }
      .topbar-files { left: 40px; padding: 0 8px; }
      .topbar-files .btn { padding: 6px 8px; font-size: 11px; }
      .editor-container { margin-left: 40px; }
      .editor-gutter { width: 28px; font-size: 10px; }
      #editorTextarea { font-size: 11px; padding: 8px 8px; }
      .tab-item { padding: 4px 8px; font-size: 11px; }
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar-files">
  <div class="topbar-left">
    <a href="/" style="color:var(--text-secondary);font-size:18px;margin-right:8px;transition:var(--transition);text-decoration:none"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
      <strong style="font-size:14px"><i class="fa-solid fa-folder-open" style="color:var(--accent);margin-right:6px"></i>{{ project }}</strong>
      <span style="font-size:10px;color:var(--text-muted);display:block">{{ username }} / {{ project }}</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="file-path" id="filePathDisplay">No file selected</span>
    <button class="btn btn-sm btn-ghost" onclick="showCreateModal()" style="border-color:rgba(16,185,129,0.2);color:var(--success)"><i class="fa-solid fa-plus"></i> New</button>
    <button class="btn btn-sm btn-ghost" onclick="deleteCurrentFile()" style="border-color:rgba(239,68,68,0.2);color:var(--danger)"><i class="fa-solid fa-trash-can"></i> Delete</button>
    <button class="btn btn-sm btn-primary" id="saveBtn" onclick="saveFile()" disabled><i class="fa-solid fa-floppy-disk"></i> Save</button>
  </div>
</div>

<!-- Layout -->
<div class="sidebar-files">
  <div class="sidebar-header">
    <span>Files</span>
    <button style="width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:12px;transition:var(--transition)" onclick="showCreateModal()" title="New file/folder"><i class="fa-solid fa-plus"></i></button>
  </div>
  <div class="file-tree" id="fileTree">
    <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading...
    </div>
  </div>
</div>

<div class="editor-container">
  <div class="editor-tabs" id="editorTabs"></div>
  <div class="editor-body">
    <div class="editor-gutter" id="editorGutter"></div>
    <div class="editor-textarea-wrap" id="editorWrap">
      <div class="editor-empty" id="editorEmpty">
        <i class="fa-regular fa-file-code"></i>
        <p>Select a file from the tree to start editing</p>
      </div>
      <textarea id="editorTextarea" style="display:none" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" id="createModal">
  <div class="modal" style="max-width:360px">
    <h3><i class="fa-solid fa-plus-circle" style="color:var(--accent)"></i> Create New</h3>
    <select id="createType" class="input" style="margin-bottom:12px">
      <option value="file">File</option>
      <option value="folder">Folder</option>
    </select>
    <input type="text" id="createName" class="input" placeholder="Enter name..." autocomplete="off" />
    <div class="modal-actions">
      <button class="btn btn-sm btn-ghost" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-sm btn-primary" onclick="createItem()" style="box-shadow:none">Create</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
  const PROJECT = '{{ project }}';
  let openFiles = {};
  let activeFile = null;
  let fileTreeData = [];
  let currentDir = '';

  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = '0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
  }

  function showCreateModal() {
    document.getElementById('createModal').classList.add('active');
    document.getElementById('createName').value = '';
    document.getElementById('createName').focus();
  }
  function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }
  document.getElementById('createModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCreateModal(); });
  document.getElementById('createName').addEventListener('keydown', e => { if (e.key === 'Enter') createItem(); if (e.key === 'Escape') closeCreateModal(); });

  async function loadTree() {
    const treeEl = document.getElementById('fileTree');
    treeEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
    try {
      const res = await fetch('/api/list-files/' + PROJECT);
      const data = await res.json();
      const files = data.files || [];
      const tree = buildTree(files);
      fileTreeData = tree;
      treeEl.innerHTML = renderTree(tree, '');
    } catch (e) {
      treeEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">Failed to load files</div>';
    }
  }

  function buildTree(paths) {
    const root = {};
    for (const p of paths) {
      const parts = p.split('/');
      let node = root;
      for (let i = 0; i < parts.length; i++) {
        const isFile = i === parts.length - 1;
        if (!node[parts[i]]) {
          node[parts[i]] = isFile ? { __type: 'file' } : { __type: 'folder', __children: {} };
        }
        if (!isFile) node = node[parts[i]].__children;
      }
    }
    return root;
  }

  function renderTree(node, basePath) {
    const entries = Object.entries(node).sort(([a, av], [b, bv]) => {
      const aIsFolder = av.__type === 'folder';
      const bIsFolder = bv.__type === 'folder';
      if (aIsFolder && !bIsFolder) return -1;
      if (!aIsFolder && bIsFolder) return 1;
      return a.localeCompare(b);
    });
    let html = '';
    for (const [name, val] of entries) {
      const isFolder = val.__type === 'folder';
      const path = basePath ? basePath + '/' + name : name;
      if (isFolder) {
        const children = val.__children || {};
        const hasVisible = Object.keys(children).length > 0;
        html += `<div class="tree-folder">`;
        html += `<div class="tree-item folder-item" data-path="${path}">`;
        html += `<span class="folder-arrow ${hasVisible ? '' : 'open'}"><i class="fa-solid fa-chevron-right"></i></span>`;
        html += `<i class="fa-solid fa-folder" style="color:var(--warning)"></i>`;
        html += `<span class="name">${name}</span>`;
        html += `</div>`;
        html += `<div class="tree-children" style="display:${hasVisible ? 'none' : 'block'}">`;
        html += renderTree(children, path);
        html += `</div></div>`;
      } else {
        html += `<div class="tree-item" data-path="${path}">`;
        html += `<span class="folder-arrow" style="visibility:hidden"><i class="fa-solid fa-chevron-right"></i></span>`;
        const ext = name.split('.').pop().toLowerCase();
        let icon = 'fa-solid fa-file';
        if (['py'].includes(ext)) icon = 'fa-brands fa-python';
        else if (['js','ts','jsx','tsx'].includes(ext)) icon = 'fa-brands fa-js';
        else if (['html','htm'].includes(ext)) icon = 'fa-brands fa-html5';
        else if (['css','scss','sass','less'].includes(ext)) icon = 'fa-brands fa-css3-alt';
        else if (['json','xml','yaml','yml','toml'].includes(ext)) icon = 'fa-solid fa-code';
        else if (['md','txt','log'].includes(ext)) icon = 'fa-regular fa-file-lines';
        else if (['png','jpg','jpeg','gif','svg','ico'].includes(ext)) icon = 'fa-regular fa-image';
        else if (['zip','tar','gz','rar','7z'].includes(ext)) icon = 'fa-regular fa-file-zipper';
        html += `<i class="${icon}" style="color:var(--text-muted)"></i>`;
        html += `<span class="name">${name}</span>`;
        html += `</div>`;
      }
    }
    return html;
  }

  function toggleFolder(el, path) {
    const children = el.parentElement.querySelector('.tree-children');
    const arrow = el.querySelector('.folder-arrow');
    if (children) {
      const isHidden = children.style.display === 'none';
      children.style.display = isHidden ? 'block' : 'none';
      if (arrow) arrow.classList.toggle('open');
    }
  }

  async function openFile(path) {
    document.querySelectorAll('.tree-item.active').forEach(e => e.classList.remove('active'));
    document.querySelector(`.tree-item[data-path="${path}"]`)?.classList.add('active');
    document.getElementById('filePathDisplay').textContent = '/' + path;
    currentDir = path.split('/').slice(0, -1).join('/');
    if (openFiles[path] !== undefined) {
      activeFile = path;
      renderEditor();
      renderTabs();
      return;
    }
    try {
      const res = await fetch('/api/read-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: PROJECT, filename: path })
      });
      const data = await res.json();
      if (data.error) { toast(data.error, 'error'); return; }
      openFiles[path] = data.content || '';
      activeFile = path;
      renderEditor();
      renderTabs();
      document.getElementById('saveBtn').disabled = false;
    } catch (e) { toast('Failed to read file', 'error'); }
  }

  function renderTabs() {
    const container = document.getElementById('editorTabs');
    const paths = Object.keys(openFiles);
    if (paths.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = paths.map(p => {
      const name = p.split('/').pop();
      return `<div class="tab-item ${p === activeFile ? 'active' : ''}" data-tab="${p}">
        <span>${name}</span>
        <span class="close-tab" data-close="${p}"><i class="fa-solid fa-xmark"></i></span>
      </div>`;
    }).join('');
    const activeTab = container.querySelector('.tab-item.active');
    if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  function switchTab(path) {
    activeFile = path;
    renderEditor();
    renderTabs();
    document.querySelectorAll('.tree-item.active').forEach(e => e.classList.remove('active'));
    document.querySelector(`.tree-item[data-path="${path}"]`)?.classList.add('active');
    document.getElementById('filePathDisplay').textContent = '/' + path;
  }

  function closeTab(path) {
    delete openFiles[path];
    if (activeFile === path) {
      const keys = Object.keys(openFiles);
      activeFile = keys.length > 0 ? keys[keys.length - 1] : null;
    }
    renderEditor();
    renderTabs();
    if (!activeFile) {
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('filePathDisplay').textContent = 'No file selected';
    }
  }

  function renderEditor() {
    const textarea = document.getElementById('editorTextarea');
    const gutter = document.getElementById('editorGutter');
    const empty = document.getElementById('editorEmpty');
    if (!activeFile || openFiles[activeFile] === undefined) {
      textarea.style.display = 'none';
      gutter.innerHTML = '';
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';
    textarea.style.display = 'block';
    const content = openFiles[activeFile] || '';
    textarea.value = content;
    updateGutter();
    textarea.focus();
  }

  function updateGutter() {
    const textarea = document.getElementById('editorTextarea');
    const gutter = document.getElementById('editorGutter');
    const lines = textarea.value.split('\n').length;
    gutter.innerHTML = Array.from({ length: lines }, (_, i) => `<div>${i + 1}</div>`).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    const treeEl = document.getElementById('fileTree');
    if (treeEl) {
      treeEl.addEventListener('click', function(e) {
        const item = e.target.closest('.tree-item');
        if (!item) return;
        const path = item.dataset.path;
        if (!path) return;
        if (item.classList.contains('folder-item')) toggleFolder(item, path);
        else openFile(path);
      });
    }
    const tabContainer = document.getElementById('editorTabs');
    if (tabContainer) {
      tabContainer.addEventListener('click', function(e) {
        const closeBtn = e.target.closest('.close-tab');
        if (closeBtn) { e.stopPropagation(); const path = closeBtn.dataset.close; if (path) closeTab(path); return; }
        const tab = e.target.closest('.tab-item');
        if (tab) { const path = tab.dataset.tab; if (path) switchTab(path); }
      });
    }
    const textarea = document.getElementById('editorTextarea');
    if (textarea) {
      textarea.addEventListener('input', () => { if (activeFile) openFiles[activeFile] = textarea.value; updateGutter(); });
      textarea.addEventListener('scroll', () => { document.getElementById('editorGutter').scrollTop = textarea.scrollTop; });
    }
  });

  async function saveFile() {
    if (!activeFile) return;
    const content = document.getElementById('editorTextarea').value;
    try {
      const res = await fetch('/api/save-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: PROJECT, filename: activeFile, content })
      });
      const data = await res.json();
      if (data.status === 'success') { openFiles[activeFile] = content; toast('Saved: ' + activeFile.split('/').pop(), 'success'); }
      else { toast(data.error || 'Save failed', 'error'); }
    } catch (e) { toast('Save failed', 'error'); }
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
  });

  async function deleteCurrentFile() {
    if (!activeFile) return;
    if (!confirm('Delete "' + activeFile.split('/').pop() + '"?')) return;
    try {
      const res = await fetch('/api/delete-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: PROJECT, filename: activeFile })
      });
      const data = await res.json();
      if (data.status === 'deleted') { toast('Deleted: ' + activeFile.split('/').pop(), 'success'); closeTab(activeFile); loadTree(); }
      else { toast('Delete failed', 'error'); }
    } catch (e) { toast('Delete failed', 'error'); }
  }

  async function createItem() {
    const type = document.getElementById('createType').value;
    let name = document.getElementById('createName').value.trim();
    if (!name) { toast('Enter a name', 'error'); return; }
    let parentDir = '';
    if (currentDir) parentDir = currentDir;
    else if (activeFile) { const parts = activeFile.split('/'); parts.pop(); parentDir = parts.join('/'); }
    const fullPath = parentDir ? parentDir + '/' + name : name;
    if (type === 'folder') { toast('Folders are auto-managed. Place a file inside to create the folder.', 'info'); closeCreateModal(); return; }
    try {
      const res = await fetch('/api/save-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: PROJECT, filename: fullPath, content: '' })
      });
      const data = await res.json();
      if (data.status === 'success') { toast('Created: ' + name, 'success'); closeCreateModal(); loadTree(); openFile(fullPath); }
      else { toast(data.error || 'Create failed', 'error'); }
    } catch (e) { toast('Create failed', 'error'); }
  }

  loadTree();
</script>
</body>
</html>
